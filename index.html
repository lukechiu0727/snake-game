<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cute Dessert Snake - By Luke Chiu</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffe8f0;
      font-family: 'Nunito', sans-serif;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: #ffe8f0;
    }

    /* Top Left Sugar Score Card */
    #score-card {
      position: absolute;
      top: 18px;
      left: 18px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 10px 22px;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(255, 134, 172, 0.25);
      border: 3px solid #ffccd9;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
    }

    #score-card .cake-icon {
      font-size: 32px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08));
    }

    #score-card .text-wrap {
      display: flex;
      flex-direction: column;
    }

    #score-card .label {
      font-family: 'Fredoka One', cursive;
      font-size: 11px;
      color: #ff5287;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    #score-card .value {
      font-family: 'Fredoka One', cursive;
      font-size: 26px;
      color: #b31d4e;
      line-height: 1.1;
    }

    /* Top Right Live Leaderboard */
    #leaderboard-card {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      padding: 12px 18px;
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(255, 134, 172, 0.25);
      border: 3px solid #ffccd9;
      min-width: 190px;
      z-index: 10;
      pointer-events: none;
    }

    #leaderboard-card h3 {
      font-family: 'Fredoka One', cursive;
      font-size: 13px;
      color: #ff5287;
      text-align: center;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      padding: 3px 0;
      color: #555;
    }

    .lb-row.player {
      color: #e6195e;
      font-weight: 900;
    }

    .lb-rank {
      width: 20px;
      color: #ff759f;
    }

    .lb-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 6px;
    }

    .lb-val {
      font-family: 'Fredoka One', cursive;
      color: #666;
    }

    .lb-row.player .lb-val {
      color: #e6195e;
    }

    /* Floating Virtual Joystick Base */
    #joystick-base {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.92) 0%, rgba(255, 240, 245, 0.85) 100%);
      border: 5px solid #ff80a6;
      box-shadow: 0 10px 30px rgba(255, 105, 153, 0.35), inset 0 2px 6px rgba(255,255,255,0.8);
      pointer-events: none;
      display: none;
      z-index: 15;
      transform: translate(-50%, -50%);
    }

    #joystick-stick {
      position: absolute;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff4d79, #d8114f);
      box-shadow: 0 6px 14px rgba(216, 17, 79, 0.45);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      pointer-events: none;
    }

    /* Rush Button Bottom Right */
    #rush-btn {
      position: absolute;
      bottom: 26px;
      right: 26px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6699 0%, #ff3366 50%, #c40a45 100%);
      border: 5px solid #ffffff;
      box-shadow: 0 10px 28px rgba(255, 51, 102, 0.45), 0 0 0 3px #ff94b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Fredoka One', cursive;
      cursor: pointer;
      z-index: 20;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      touch-action: none;
    }

    #rush-btn:active, #rush-btn.active {
      transform: scale(0.92);
      box-shadow: 0 4px 14px rgba(255, 51, 102, 0.6), 0 0 0 3px #ff94b8;
    }

    #rush-btn .rush-top {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 24px;
    }

    #rush-btn .rush-text {
      font-size: 13px;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.25);
    }

    /* Start / Opening Splash Overlay */
    #start-screen {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 235, 242, 0.97) 0%, rgba(255, 210, 226, 0.98) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .modal-box {
      background: #ffffff;
      padding: 32px 36px;
      border-radius: 36px;
      box-shadow: 0 20px 60px rgba(245, 92, 143, 0.35);
      border: 5px solid #ffccd9;
      text-align: center;
      max-width: 420px;
      width: 90%;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .game-logo {
      font-size: 60px;
      margin-bottom: 6px;
      animation: bounce 1.8s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .game-title {
      font-family: 'Fredoka One', cursive;
      font-size: 34px;
      color: #ff3b77;
      text-shadow: 2px 3px 0 #ffe0ea;
      margin-bottom: 4px;
    }

    .credit-badge {
      display: inline-block;
      font-family: 'Fredoka One', cursive;
      background: linear-gradient(135deg, #ff7096, #ff4071);
      color: #fff;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 15px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(255, 64, 113, 0.3);
    }

    .input-group {
      margin-bottom: 22px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: #ff5c8a;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 18px;
      border: 3px solid #ffccd9;
      border-radius: 20px;
      font-size: 17px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      color: #b31d4e;
      background: #fff8fa;
      outline: none;
      transition: all 0.2s;
    }

    .input-group input:focus {
      border-color: #ff5287;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 82, 135, 0.18);
    }

    .play-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ff4d79, #e6004c);
      color: white;
      font-family: 'Fredoka One', cursive;
      font-size: 22px;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(230, 0, 76, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .play-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(230, 0, 76, 0.42);
    }

    .play-btn:active {
      transform: translateY(1px);
    }

    /* Game Over Modal */
    #gameover-screen {
      position: absolute;
      inset: 0;
      background: rgba(40, 10, 25, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .gameover-box {
      background: #ffffff;
      padding: 34px 40px;
      border-radius: 36px;
      border: 5px solid #ffccd9;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .gameover-title {
      font-family: 'Fredoka One', cursive;
      font-size: 32px;
      color: #ff2d68;
      margin-bottom: 8px;
    }

    .final-score {
      font-size: 16px;
      font-weight: 800;
      color: #777;
      margin-bottom: 20px;
    }

    .final-score span {
      font-family: 'Fredoka One', cursive;
      font-size: 28px;
      color: #c90f4e;
      display: block;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Sugar Score Card (Top-Left) -->
  <div id="score-card">
    <div class="cake-icon">🍰</div>
    <div class="text-wrap">
      <div class="label">Sugar Score</div>
      <div class="value" id="score-val">0</div>
    </div>
  </div>

  <!-- Live Leaderboard (Top-Right) -->
  <div id="leaderboard-card">
    <h3>👑 TOP SWEETS</h3>
    <div id="leaderboard-list"></div>
  </div>

  <!-- Dynamic Floating Joystick -->
  <div id="joystick-base">
    <div id="joystick-stick">🍓</div>
  </div>

  <!-- Rush Button (Bottom-Right) -->
  <div id="rush-btn">
    <div class="rush-top">
      <span>⚡</span>
      <span>🍩</span>
    </div>
    <div class="rush-text">RUSH!</div>
  </div>

  <!-- Start Screen with Opening Animation -->
  <div id="start-screen">
    <div class="modal-box">
      <div class="game-logo">🍰🍓🍩</div>
      <h1 class="game-title">Sugar Slither</h1>
      <div class="credit-badge">By Luke Chiu</div>
      <div class="input-group">
        <label for="nickname-input">Sweet Nickname</label>
        <input type="text" id="nickname-input" maxlength="12" value="Berry Mochi" placeholder="Enter name...">
      </div>
      <button class="play-btn" id="start-btn">PLAY NOW ✨</button>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-screen">
    <div class="gameover-box">
      <div style="font-size: 48px; margin-bottom: 6px;">💥🍰</div>
      <h2 class="gameover-title">Crumbly Defeat!</h2>
      <p class="final-score">Final Sugar Score<span id="final-score-val">0</span></p>
      <button class="play-btn" id="restart-btn">TRY AGAIN 🍓</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI elements
    const scoreValEl = document.getElementById('score-val');
    const leaderboardListEl = document.getElementById('leaderboard-list');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const nicknameInput = document.getElementById('nickname-input');
    const gameoverScreen = document.getElementById('gameover-screen');
    const restartBtn = document.getElementById('restart-btn');
    const finalScoreVal = document.getElementById('final-score-val');
    const joystickBase = document.getElementById('joystick-base');
    const joystickStick = document.getElementById('joystick-stick');
    const rushBtn = document.getElementById('rush-btn');

    // Arena Settings
    const ARENA_RADIUS = 1800; // Big circular arena
    const ARENA_CENTER = { x: 0, y: 0 };
    const FOOD_COUNT = 340;

    // Viewport & Scale
    let screenW = window.innerWidth;
    let screenH = window.innerHeight;

    function resizeCanvas() {
      screenW = window.innerWidth;
      screenH = window.innerHeight;
      canvas.width = screenW;
      canvas.height = screenH;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Audio SFX synthesis
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type = 'sine', duration = 0.12, gainLvl = 0.15) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainLvl, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundEat() {
      playTone(600 + Math.random() * 250, 'triangle', 0.08, 0.12);
    }

    function soundDefeatEnemy() {
      if (!audioCtx) return;
      [400, 600, 850, 1100].forEach((f, idx) => {
        setTimeout(() => playTone(f, 'sine', 0.16, 0.18), idx * 60);
      });
    }

    function soundGameOver() {
      if (!audioCtx) return;
      [440, 370, 310, 240].forEach((f, idx) => {
        setTimeout(() => playTone(f, 'sawtooth', 0.22, 0.2), idx * 80);
      });
    }

    // Food Types & Sprites
    const DESSERT_TYPES = [
      { emoji: '🍓', glow: 'rgba(255, 105, 140, 0.4)', stroke: '#ff4d79', points: 15, radius: 19 },
      { emoji: '🍩', glow: 'rgba(210, 140, 90, 0.4)',  stroke: '#cd853f', points: 20, radius: 20 },
      { emoji: '🍰', glow: 'rgba(255, 180, 200, 0.4)', stroke: '#ff6699', points: 30, radius: 21 },
      { emoji: '🧁', glow: 'rgba(200, 160, 255, 0.4)', stroke: '#b366ff', points: 25, radius: 20 },
      { emoji: '🧋', glow: 'rgba(230, 175, 130, 0.4)', stroke: '#d29966', points: 35, radius: 22 },
      { emoji: '🍪', glow: 'rgba(218, 165, 32, 0.4)',  stroke: '#d49b38', points: 10, radius: 18 },
      { emoji: '🍭', glow: 'rgba(120, 220, 255, 0.4)', stroke: '#40c0e0', points: 15, radius: 19 }
    ];

    // Dark Enemy Palettes (Deep, moody, high-contrast dark colors)
    const DARK_ENEMY_PALETTES = [
      {
        // Dark Obsidian / Midnight
        primary: '#1c1b24',
        secondary: '#2e2a3b',
        border: '#453f57',
        glow: 'rgba(69, 63, 87, 0.4)',
        eyeGlow: '#a855f7',
        horn: '🪨'
      },
      {
        // Deep Dark Chocolate / Espresso
        primary: '#24140e',
        secondary: '#3d2419',
        border: '#5c3826',
        glow: 'rgba(92, 56, 38, 0.4)',
        eyeGlow: '#fb923c',
        horn: '☕'
      },
      {
        // Dark Crimson / Blood Cherry
        primary: '#2e0a14',
        secondary: '#4a1222',
        border: '#731c35',
        glow: 'rgba(115, 28, 53, 0.45)',
        eyeGlow: '#f43f5e',
        horn: '🍒'
      },
      {
        // Dark Midnight Teal / Abyssal Blue
        primary: '#091e24',
        secondary: '#11353f',
        border: '#1f5363',
        glow: 'rgba(31, 83, 99, 0.45)',
        eyeGlow: '#38bdf8',
        horn: '🫐'
      }
    ];

    // AI Personalities & Configuration
    const AI_CONFIGS = [
      { name: 'Dark Choco', personality: 'HUNTER',    paletteIdx: 1 },
      { name: 'Shadow Plum',personality: 'GLUTTON',   paletteIdx: 0 },
      { name: 'Black Cherry',personality: 'AMBUSHER', paletteIdx: 2 },
      { name: 'Abyss Berry',personality: 'TRICKSTER', paletteIdx: 3 }
    ];

    // Food Pool
    let foods = [];

    function spawnFood(forceX = null, forceY = null, customType = null) {
      let x, y;
      if (forceX !== null && forceY !== null) {
        x = forceX;
        y = forceY;
      } else {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.sqrt(Math.random()) * (ARENA_RADIUS - 70);
        x = Math.cos(angle) * dist;
        y = Math.sin(angle) * dist;
      }
      const type = customType || DESSERT_TYPES[Math.floor(Math.random() * DESSERT_TYPES.length)];
      return {
        x,
        y,
        type,
        pulseOffset: Math.random() * Math.PI * 2,
        size: type.radius
      };
    }

    function initFoodCluster() {
      foods = [];
      for (let i = 0; i < FOOD_COUNT; i++) {
        foods.push(spawnFood());
      }
    }

    // Floating Particles System
    let particles = [];
    function emitSweetBurst(x, y, count = 16, color = '#ff4d79') {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.8 + Math.random() * 5.2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 4 + Math.random() * 6,
          color,
          alpha: 1.0,
          decay: 0.02 + Math.random() * 0.03
        });
      }
    }

    // Snake Class
    class Snake {
      constructor(x, y, name, isAI = false, aiConfig = null) {
        this.isAI = isAI;
        this.name = name;
        this.aiConfig = aiConfig;
        this.x = x;
        this.y = y;
        this.angle = Math.random() * Math.PI * 2;
        this.targetAngle = this.angle;
        this.baseSpeed = 3.6;
        this.rushSpeed = 6.8;
        this.isBoosting = false;
        this.radius = 24;
        this.score = 300;
        this.dead = false;

        // Custom appearance
        if (!isAI) {
          // Cute Player Colors (Strawberry pink / blush cream)
          this.colors = {
            primary: '#ff3d74',
            secondary: '#ff7fa6',
            cream: '#ffffff',
            border: '#ffadc3',
            glow: 'rgba(255, 61, 116, 0.45)',
            eyeGlow: '#fff',
            topping: '🍓'
          };
        } else {
          // Dark Enemy Palettes
          const pal = DARK_ENEMY_PALETTES[aiConfig.paletteIdx % DARK_ENEMY_PALETTES.length];
          this.colors = {
            primary: pal.primary,
            secondary: pal.secondary,
            cream: '#3a3347',
            border: pal.border,
            glow: pal.glow,
            eyeGlow: pal.eyeGlow,
            topping: pal.horn
          };
        }

        this.history = [];
        this.length = 26;

        // Populate initial body history
        const segDist = 8;
        for (let i = 0; i < this.length * segDist; i++) {
          this.history.push({
            x: this.x - Math.cos(this.angle) * i,
            y: this.y - Math.sin(this.angle) * i
          });
        }

        // AI behavior state variables
        this.aiTimer = 0;
        this.aiTurnRate = 0.07;
        this.state = 'FORAGING';
      }

      getSegmentPositions() {
        const segSpacing = 9;
        const positions = [];
        for (let i = 0; i < this.length; i++) {
          const index = i * segSpacing;
          if (index < this.history.length) {
            positions.push(this.history[index]);
          }
        }
        return positions;
      }

      updateAI(allSnakes) {
        if (!this.isAI || this.dead) return;
        this.aiTimer++;

        const player = allSnakes.find(s => !s.isAI && !s.dead);

        // 1. Raycast obstacle avoidance feelers (Detect Arena wall and other snakes)
        let feelerHit = false;
        let bestTurnDelta = 0;
        const feelerDist = 95;
        const feelerAngles = [0, 0.5, -0.5, 0.9, -0.9, 1.4, -1.4];

        for (let fa of feelerAngles) {
          const checkAngle = this.angle + fa;
          const fx = this.x + Math.cos(checkAngle) * feelerDist;
          const fy = this.y + Math.sin(checkAngle) * feelerDist;

          // Arena boundary test
          const distToCenter = Math.hypot(fx, fy);
          let collided = (distToCenter >= ARENA_RADIUS - 40);

          // Other snake collision test
          if (!collided) {
            for (let other of allSnakes) {
              if (other === this || other.dead) continue;
              const segs = other.getSegmentPositions();
              // Don't test head directly, test segments
              for (let s of segs) {
                if (Math.hypot(fx - s.x, fy - s.y) < this.radius + 16) {
                  collided = true;
                  break;
                }
              }
              if (collided) break;
            }
          }

          if (collided) {
            feelerHit = true;
          } else if (feelerHit && bestTurnDelta === 0) {
            // Find first free corridor
            bestTurnDelta = fa;
          }
        }

        if (feelerHit) {
          this.targetAngle += (bestTurnDelta !== 0 ? Math.sign(bestTurnDelta) * 0.18 : 0.22);
          this.isBoosting = false;
          return;
        }

        // 2. Personality-driven behavior
        const pType = this.aiConfig.personality;

        if (pType === 'HUNTER' && player) {
          const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
          if (distToPlayer < 750) {
            // Cut in front of player
            const leadX = player.x + Math.cos(player.angle) * 110;
            const leadY = player.y + Math.sin(player.angle) * 110;
            this.targetAngle = Math.atan2(leadY - this.y, leadX - this.x);
            this.isBoosting = (distToPlayer < 380 && this.score > 250);
            return;
          }
        }

        if (pType === 'AMBUSHER' && player) {
          const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
          if (distToPlayer < 400) {
            // Circle tight around player
            const tangentAngle = Math.atan2(player.y - this.y, player.x - this.x) + Math.PI / 2.2;
            this.targetAngle = tangentAngle;
            this.isBoosting = (Math.random() < 0.2 && this.score > 200);
            return;
          }
        }

        // Default or Glutton: Hunt nearest sweets
        let nearestFood = null;
        let minDist = 650;
        for (let f of foods) {
          const d = Math.hypot(f.x - this.x, f.y - this.y);
          if (d < minDist) {
            minDist = d;
            nearestFood = f;
          }
        }

        if (nearestFood) {
          this.targetAngle = Math.atan2(nearestFood.y - this.y, nearestFood.x - this.x);
          this.isBoosting = (pType === 'GLUTTON' && minDist < 200 && Math.random() < 0.15 && this.score > 300);
        } else if (this.aiTimer % 60 === 0) {
          this.targetAngle += (Math.random() - 0.5) * 1.5;
          this.isBoosting = false;
        }
      }

      update() {
        if (this.dead) return;

        // Angular smoothing
        let diff = this.targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.angle += diff * (this.isAI ? 0.085 : 0.14);

        // Speed & boosting cost
        const currentSpeed = this.isBoosting ? this.rushSpeed : this.baseSpeed;
        if (this.isBoosting && this.score > 50) {
          this.score -= 0.18;
          if (Math.random() < 0.25) {
            const tail = this.history[this.history.length - 1];
            if (tail) foods.push(spawnFood(tail.x + (Math.random()-0.5)*10, tail.y + (Math.random()-0.5)*10));
          }
        }

        // Movement
        this.x += Math.cos(this.angle) * currentSpeed;
        this.y += Math.sin(this.angle) * currentSpeed;

        // Record history for body segments
        this.history.unshift({ x: this.x, y: this.y });
        const maxHistory = this.length * 10;
        if (this.history.length > maxHistory) {
          this.history.pop();
        }

        // Check arena boundary collision
        const distFromCenter = Math.hypot(this.x, this.y);
        if (distFromCenter >= ARENA_RADIUS - this.radius) {
          this.die();
        }
      }

      die() {
        if (this.dead) return;
        this.dead = true;
        emitSweetBurst(this.x, this.y, 35, this.colors.primary);

        // Drop body as sweet food treats
        const segs = this.getSegmentPositions();
        for (let i = 0; i < segs.length; i += 2) {
          foods.push(spawnFood(
            segs[i].x + (Math.random() - 0.5) * 16,
            segs[i].y + (Math.random() - 0.5) * 16
          ));
        }

        if (!this.isAI) {
          soundGameOver();
          showGameOver();
        } else {
          soundDefeatEnemy();
        }
      }

      draw(ctx) {
        if (this.dead) return;
        const segs = this.getSegmentPositions();

        // 1. Draw Body Segments (from tail to neck)
        for (let i = segs.length - 1; i >= 1; i--) {
          const pt = segs[i];
          const isStripe = (i % 2 === 0);
          const rad = this.radius * (1 - (i / segs.length) * 0.32);

          // Glow outline
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, rad + 3, 0, Math.PI * 2);
          ctx.fillStyle = this.colors.border;
          ctx.fill();

          // Bubble interior
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, rad, 0, Math.PI * 2);
          ctx.fillStyle = isStripe ? this.colors.primary : this.colors.secondary;
          ctx.fill();

          // Dark gloss highlight
          ctx.beginPath();
          ctx.arc(pt.x - rad * 0.3, pt.y - rad * 0.3, rad * 0.28, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
          ctx.fill();
        }

        // 2. Draw Head
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Head shadow / glow
        ctx.shadowColor = this.colors.glow;
        ctx.shadowBlur = 12;

        // Head Outer border
        ctx.beginPath();
        ctx.arc(0, 0, this.radius + 3.5, 0, Math.PI * 2);
        ctx.fillStyle = this.colors.border;
        ctx.fill();

        ctx.shadowBlur = 0;

        // Head Base
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.colors.primary;
        ctx.fill();

        // Cheeks
        if (!this.isAI) {
          // Rosy cute cheeks for player
          ctx.beginPath();
          ctx.ellipse(4, -this.radius * 0.58, 5, 3.5, 0, 0, Math.PI * 2);
          ctx.ellipse(4, this.radius * 0.58, 5, 3.5, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 120, 160, 0.6)';
          ctx.fill();
        } else {
          // Dark menacing blush / vents for enemies
          ctx.beginPath();
          ctx.ellipse(3, -this.radius * 0.55, 4, 2.5, 0, 0, Math.PI * 2);
          ctx.ellipse(3, this.radius * 0.55, 4, 2.5, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
          ctx.fill();
        }

        // Big Anime Eyes
        const eyeOffset = this.radius * 0.45;
        const eyeX = this.radius * 0.35;

        [-eyeOffset, eyeOffset].forEach(eyeY => {
          // Eye sclera
          ctx.beginPath();
          ctx.arc(eyeX, eyeY, 6.5, 0, Math.PI * 2);
          ctx.fillStyle = this.isAI ? '#111' : '#ffffff';
          ctx.fill();

          // Dark AI glowing iris / Player pupil
          ctx.beginPath();
          ctx.arc(eyeX + 1.5, eyeY, 4, 0, Math.PI * 2);
          ctx.fillStyle = this.isAI ? this.colors.eyeGlow : '#1a0510';
          ctx.fill();

          // Eye Catchlight sparkle
          ctx.beginPath();
          ctx.arc(eyeX + 2.5, eyeY - 1.5, 1.8, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        });

        // Topping on the head (Strawberry / Dark Horn / Topping)
        ctx.font = `${this.radius * 1.05}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.colors.topping, -this.radius * 0.35, 0);

        ctx.restore();

        // 3. Name Tag
        ctx.save();
        ctx.font = "800 13px 'Nunito', sans-serif";
        ctx.textAlign = 'center';
        ctx.fillStyle = this.isAI ? '#3d2f3d' : '#e6005c';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3.5;
        ctx.strokeText(this.name, this.x, this.y - this.radius - 12);
        ctx.fillText(this.name, this.x, this.y - this.radius - 12);
        ctx.restore();
      }
    }

    // Helper: Safe Spawn Position (Guarantees player & enemies never spawn in same place)
    function getSafeSpawnPosition(existingSnakes, minClearance = 720) {
      for (let attempt = 0; attempt < 80; attempt++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 300 + Math.random() * (ARENA_RADIUS - 600);
        const candidate = {
          x: Math.cos(angle) * dist,
          y: Math.sin(angle) * dist
        };

        let isFarEnough = true;
        for (let other of existingSnakes) {
          if (!other || other.dead) continue;
          if (Math.hypot(candidate.x - other.x, candidate.y - other.y) < minClearance) {
            isFarEnough = false;
            break;
          }
        }

        if (isFarEnough) return candidate;
      }
      // Fallback
      return { x: (Math.random() - 0.5) * 800, y: (Math.random() - 0.5) * 800 };
    }

    // Game Instances
    let playerSnake = null;
    let enemySnakes = [];
    let camera = { x: 0, y: 0 };
    let gameRunning = false;

    function initGame() {
      const playerName = nicknameInput.value.trim() || 'Berry Mochi';
      
      // Clear arrays
      foods = [];
      particles = [];
      enemySnakes = [];

      // Create Player centrally
      playerSnake = new Snake(0, 0, playerName, false);
      const activeList = [playerSnake];

      // Spawn AI Rivals with safe distance spacing
      AI_CONFIGS.forEach((config) => {
        const safePos = getSafeSpawnPosition(activeList, 720);
        const enemy = new Snake(safePos.x, safePos.y, config.name, true, config);
        enemySnakes.push(enemy);
        activeList.push(enemy);
      });

      initFoodCluster();
      gameRunning = true;
    }

    // Respawn single enemy safely
    function respawnEnemy(enemy) {
      setTimeout(() => {
        if (!gameRunning) return;
        const allCurrent = [playerSnake, ...enemySnakes.filter(e => !e.dead)];
        const safePos = getSafeSpawnPosition(allCurrent, 750);
        
        enemy.x = safePos.x;
        enemy.y = safePos.y;
        enemy.dead = false;
        enemy.score = 280 + Math.floor(Math.random() * 200);
        enemy.length = 24;
        enemy.history = [];
        for (let i = 0; i < enemy.length * 9; i++) {
          enemy.history.push({ x: enemy.x, y: enemy.y });
        }
      }, 3500);
    }

    // Collisions and Eating Rules
    function handleCollisions() {
      const allSnakes = [playerSnake, ...enemySnakes].filter(s => s && !s.dead);

      // 1. Food Gathering
      for (let snake of allSnakes) {
        for (let i = foods.length - 1; i >= 0; i--) {
          const f = foods[i];
          const dist = Math.hypot(snake.x - f.x, snake.y - f.y);
          if (dist < snake.radius + f.size) {
            snake.score += f.type.points;
            snake.length = Math.min(220, 24 + Math.floor(snake.score / 28));
            foods.splice(i, 1);
            foods.push(spawnFood()); // Maintain world density

            if (snake === playerSnake) {
              soundEat();
              scoreValEl.textContent = Math.floor(playerSnake.score);
            }
          }
        }
      }

      // 2. Snake vs Snake elimination (Slither rules: Hitting another body dies; self-crossing is immune)
      for (let headSnake of allSnakes) {
        for (let bodySnake of allSnakes) {
          // Immune to hitting own body
          if (headSnake === bodySnake) continue;

          const segs = bodySnake.getSegmentPositions();
          for (let s of segs) {
            const hitDist = Math.hypot(headSnake.x - s.x, headSnake.y - s.y);
            if (hitDist < headSnake.radius + bodySnake.radius * 0.75) {
              // headSnake crashes into bodySnake's body!
              headSnake.die();

              if (headSnake.isAI) {
                respawnEnemy(headSnake);
              }
              break;
            }
          }
          if (headSnake.dead) break;
        }
      }
    }

    // Floating Joystick State & Event Handlers
    let joystickActive = false;
    let joystickTouchId = null;
    let joyCenter = { x: 0, y: 0 };
    const maxJoyRadius = 55;

    function handleJoyStart(clientX, clientY, id = null) {
      if (!gameRunning) return;
      joystickActive = true;
      joystickTouchId = id;
      joyCenter = { x: clientX, y: clientY };

      joystickBase.style.left = `${clientX}px`;
      joystickBase.style.top = `${clientY}px`;
      joystickBase.style.display = 'block';

      joystickStick.style.transform = `translate(-50%, -50%) translate(0px, 0px)`;
    }

    function handleJoyMove(clientX, clientY) {
      if (!joystickActive || !playerSnake) return;
      const dx = clientX - joyCenter.x;
      const dy = clientY - joyCenter.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 8) {
        playerSnake.targetAngle = Math.atan2(dy, dx);
      }

      const clampedDist = Math.min(dist, maxJoyRadius);
      const angle = Math.atan2(dy, dx);
      const stickX = Math.cos(angle) * clampedDist;
      const stickY = Math.sin(angle) * clampedDist;

      joystickStick.style.transform = `translate(calc(-50% + ${stickX}px), calc(-50% + ${stickY}px))`;
    }

    function handleJoyEnd() {
      joystickActive = false;
      joystickTouchId = null;
      joystickBase.style.display = 'none';
      joystickStick.style.transform = `translate(-50%, -50%)`;
    }

    // Pointer Events on Canvas
    window.addEventListener('pointerdown', (e) => {
      // Ignore if clicking HUD or Rush Button
      if (e.target.closest('#rush-btn') || e.target.closest('#score-card') || e.target.closest('#leaderboard-card')) return;
      if (!joystickActive) {
        handleJoyStart(e.clientX, e.clientY, e.pointerId);
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (joystickActive && e.pointerId === joystickTouchId) {
        handleJoyMove(e.clientX, e.clientY);
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (joystickActive && e.pointerId === joystickTouchId) {
        handleJoyEnd();
      }
    });

    window.addEventListener('pointercancel', (e) => {
      if (joystickActive && e.pointerId === joystickTouchId) {
        handleJoyEnd();
      }
    });

    // Rush Button Pointer Listeners
    rushBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (playerSnake) playerSnake.isBoosting = true;
      rushBtn.classList.add('active');
    });

    const releaseRush = () => {
      if (playerSnake) playerSnake.isBoosting = false;
      rushBtn.classList.remove('active');
    };

    rushBtn.addEventListener('pointerup', releaseRush);
    rushBtn.addEventListener('pointerleave', releaseRush);
    rushBtn.addEventListener('pointercancel', releaseRush);

    // Keyboard support for desktop
    window.addEventListener('keydown', (e) => {
      if (!playerSnake || !gameRunning) return;
      if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
        playerSnake.isBoosting = true;
        rushBtn.classList.add('active');
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') playerSnake.targetAngle -= 0.22;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') playerSnake.targetAngle += 0.22;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
        if (playerSnake) playerSnake.isBoosting = false;
        rushBtn.classList.remove('active');
      }
    });

    // UI Updates
    function updateLeaderboard() {
      const allSnakes = [playerSnake, ...enemySnakes].filter(s => s !== null);
      allSnakes.sort((a, b) => b.score - a.score);

      leaderboardListEl.innerHTML = '';
      allSnakes.slice(0, 5).forEach((snake, idx) => {
        const row = document.createElement('div');
        row.className = `lb-row ${snake === playerSnake ? 'player' : ''}`;
        row.innerHTML = `
          <span class="lb-rank">#${idx + 1}</span>
          <span class="lb-name">${snake.name}</span>
          <span class="lb-val">${Math.floor(snake.score)}</span>
        `;
        leaderboardListEl.appendChild(row);
      });
    }

    function showGameOver() {
      gameRunning = false;
      handleJoyEnd();
      finalScoreVal.textContent = Math.floor(playerSnake.score);
      gameoverScreen.style.display = 'flex';
    }

    // Start / Restart Handlers
    startBtn.addEventListener('click', () => {
      initAudio();
      startScreen.style.display = 'none';
      initGame();
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      gameoverScreen.style.display = 'none';
      initGame();
    });

    // Render Background & Fine Pink Grid
    function renderBackground() {
      // Soft pink arena background
      ctx.fillStyle = '#ffe8f0';
      ctx.fillRect(0, 0, screenW, screenH);

      // Grid line calculations aligned with camera
      const gridSize = 50;
      const offsetX = -camera.x % gridSize;
      const offsetY = -camera.y % gridSize;

      ctx.beginPath();
      ctx.strokeStyle = '#ffd2e2';
      ctx.lineWidth = 1.2;

      for (let x = offsetX; x < screenW; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, screenH);
      }
      for (let y = offsetY; y < screenH; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(screenW, y);
      }
      ctx.stroke();
    }

    // Render Glowing Circular Arena Border
    function renderArenaBoundary() {
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, ARENA_RADIUS, 0, Math.PI * 2);

      // Glowing red ring
      ctx.shadowColor = 'rgba(255, 30, 80, 0.8)';
      ctx.shadowBlur = 24;
      ctx.lineWidth = 16;
      ctx.strokeStyle = '#ff2b5e';
      ctx.stroke();

      // Outer boundary ring border
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      ctx.restore();
    }

    // Render Food
    function renderFoods(time) {
      ctx.font = "20px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (let f of foods) {
        // Culling for performance
        if (Math.hypot(f.x - camera.x, f.y - camera.y) > Math.max(screenW, screenH) * 0.85) {
          continue;
        }

        const pulse = Math.sin(time * 0.004 + f.pulseOffset) * 2;
        const rad = f.size + pulse;

        // Glowing dessert halo
        ctx.beginPath();
        ctx.arc(f.x, f.y, rad + 4, 0, Math.PI * 2);
        ctx.fillStyle = f.type.glow;
        ctx.fill();

        // Dessert bubble body
        ctx.beginPath();
        ctx.arc(f.x, f.y, rad, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.strokeStyle = f.type.stroke;
        ctx.lineWidth = 2.5;
        ctx.fill();
        ctx.stroke();

        // Dessert emoji icon
        ctx.fillText(f.type.emoji, f.x, f.y + 1);
      }
    }

    // Render Particles
    function renderParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
      }
    }

    // Main Game Loop
    let lastLeaderboardUpdate = 0;

    function gameLoop(time) {
      requestAnimationFrame(gameLoop);

      if (gameRunning && playerSnake) {
        // AI step
        enemySnakes.forEach(enemy => {
          enemy.updateAI([playerSnake, ...enemySnakes]);
          enemy.update();
        });

        // Player step
        playerSnake.update();

        // Collision logic
        handleCollisions();

        // Camera smoothly tracks player
        camera.x += (playerSnake.x - camera.x) * 0.1;
        camera.y += (playerSnake.y - camera.y) * 0.1;

        // Leaderboard throttle
        if (time - lastLeaderboardUpdate > 250) {
          updateLeaderboard();
          lastLeaderboardUpdate = time;
        }
      }

      // Drawing
      ctx.clearRect(0, 0, screenW, screenH);
      renderBackground();

      // World Camera Transformation
      ctx.save();
      ctx.translate(screenW / 2 - camera.x, screenH / 2 - camera.y);

      // Arena boundary ring
      renderArenaBoundary();

      // Collectibles
      renderFoods(time);

      // Draw Enemies (Dark Snakes)
      enemySnakes.forEach(enemy => enemy.draw(ctx));

      // Draw Player Snake
      if (playerSnake) playerSnake.draw(ctx);

      // Particles
      renderParticles();

      ctx.restore();
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
