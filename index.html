  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffe8f0;
      font-family: 'Nunito', sans-serif;
      position: fixed;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: #ffe8f0;
    }

    /* Top Left Sugar Score Card */
    #score-card {
      position: absolute;
      top: calc(env(safe-area-inset-top, 16px) + 12px);
      left: calc(env(safe-area-inset-left, 16px) + 12px);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(255, 134, 172, 0.25);
      border: 3px solid #ffccd9;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      pointer-events: none;
    }

    #score-card .cake-icon {
      font-size: 28px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08));
    }

    #score-card .text-wrap {
      display: flex;
      flex-direction: column;
    }

    #score-card .label {
      font-family: 'Fredoka One', cursive;
      font-size: 10px;
      color: #ff5287;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    #score-card .value {
      font-family: 'Fredoka One', cursive;
      font-size: 24px;
      color: #b31d4e;
      line-height: 1.1;
    }

    /* Top Right Live Leaderboard */
    #leaderboard-card {
      position: absolute;
      top: calc(env(safe-area-inset-top, 16px) + 12px);
      right: calc(env(safe-area-inset-right, 16px) + 12px);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(255, 134, 172, 0.25);
      border: 3px solid #ffccd9;
      min-width: 165px;
      z-index: 10;
      pointer-events: none;
    }

    #leaderboard-card h3 {
      font-family: 'Fredoka One', cursive;
      font-size: 11px;
      color: #ff5287;
      text-align: center;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      padding: 2px 0;
      color: #555;
    }

    .lb-row.player {
      color: #e6195e;
      font-weight: 900;
    }

    .lb-rank {
      width: 18px;
      color: #ff759f;
    }

    .lb-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 4px;
    }

    .lb-val {
      font-family: 'Fredoka One', cursive;
      color: #666;
    }

    .lb-row.player .lb-val {
      color: #e6195e;
    }

    /* Floating Virtual Joystick */
    #joystick-base {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.92) 0%, rgba(255, 240, 245, 0.85) 100%);
      border: 5px solid #ff80a6;
      box-shadow: 0 10px 30px rgba(255, 105, 153, 0.35), inset 0 2px 6px rgba(255,255,255,0.8);
      pointer-events: none;
      display: none;
      z-index: 15;
      transform: translate(-50%, -50%);
    }
