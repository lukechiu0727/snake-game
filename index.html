<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Home - Classroom</title>

  <!-- iOS Web App Fullscreen Config -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Classroom">
  <meta name="theme-color" content="#03baa8">

  <!-- iPhone Home Screen App Icon & Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./apple-touch-icon.png">

  <!-- Web App Manifest for iOS PWA -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Classroom%22%2C%22short_name%22%3A%22Classroom%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22apple-touch-icon.png%22%2C%22sizes%22%3A%22180x180%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2303baa8%22%2C%22theme_color%22%3A%22%2303baa8%22%7D">

  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffe8f0;
      font-family: 'Nunito', sans-serif;
      position: fixed;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: #ffe8f0;
    }

    #score-card {
      position: absolute;
      top: calc(env(safe-area-inset-top, 16px) + 12px);
      left: calc(env(safe-area-inset-left, 16px) + 12px);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(255, 134, 172, 0.25);
      border: 3px solid #ffccd9;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      pointer-events: none;
    }

    #score-card .cake-icon {
      font-size: 28px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08));
    }

    #score-card .text-wrap {
      display: flex;
      flex-direction: column;
    }

    #score-card .label {
      font-family: 'Fredoka One', cursive;
      font-size: 10px;
      color: #ff5287;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    #score-card .value {
      font-family: 'Fredoka One', cursive;
      font-size: 24px;
      color: #b31d4e;
      line-height: 1.1;
    }

    #leaderboard-card {
      position: absolute;
      top: calc(env(safe-area-inset-top, 16px) + 12px);
      right: calc(env(safe-area-inset-right, 16px) + 12px);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(255, 134, 172, 0.25);
      border: 3px solid #ffccd9;
      min-width: 165px;
      z-index: 10;
      pointer-events: none;
    }

    #leaderboard-card h3 {
      font-family: 'Fredoka One', cursive;
      font-size: 11px;
      color: #ff5287;
      text-align: center;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      padding: 2px 0;
      color: #555;
    }

    .lb-row.player {
      color: #e6195e;
      font-weight: 900;
    }

    .lb-rank {
      width: 18px;
      color: #ff759f;
    }

    .lb-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 4px;
    }

    .lb-val {
      font-family: 'Fredoka One', cursive;
      color: #666;
    }

    .lb-row.player .lb-val {
      color: #e6195e;
    }

    #joystick-base {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.92) 0%, rgba(255, 240, 245, 0.85) 100%);
      border: 5px solid #ff80a6;
      box-shadow: 0 10px 30px rgba(255, 105, 153, 0.35), inset 0 2px 6px rgba(255,255,255,0.8);
      pointer-events: none;
      display: none;
      z-index: 15;
      transform: translate(-50%, -50%);
    }

    #joystick-stick {
      position: absolute;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff4d79, #d8114f);
      box-shadow: 0 6px 14px rgba(216, 17, 79, 0.45);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      pointer-events: none;
    }

    #rush-btn {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 16px);
      right: calc(env(safe-area-inset-right, 20px) + 16px);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6699 0%, #ff3366 50%, #c40a45 100%);
      border: 4px solid #ffffff;
      box-shadow: 0 8px 24px rgba(255, 51, 102, 0.45), 0 0 0 3px #ff94b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Fredoka One', cursive;
      cursor: pointer;
      z-index: 20;
      transition: transform 0.1s ease;
      touch-action: none;
    }

    #rush-btn:active, #rush-btn.active {
      transform: scale(0.92);
    }

    #rush-btn .rush-top {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 22px;
    }

    #rush-btn .rush-text {
      font-size: 12px;
      letter-spacing: 0.8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.25);
    }

    #start-screen, #gameover-screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(10px);
      padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 20px);
    }

    #start-screen {
      background: radial-gradient(circle at center, rgba(255, 235, 242, 0.97) 0%, rgba(255, 210, 226, 0.98) 100%);
    }

    #gameover-screen {
      background: rgba(40, 10, 25, 0.7);
      display: none;
    }

    .modal-box, .gameover-box {
      background: #ffffff;
      padding: 30px 32px;
      border-radius: 34px;
      box-shadow: 0 20px 60px rgba(245, 92, 143, 0.35);
      border: 4px solid #ffccd9;
      text-align: center;
      max-width: 380px;
      width: 90%;
    }

    .app-preview-icon {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      margin: 0 auto 10px auto;
      box-shadow: 0 8px 20px rgba(3, 186, 168, 0.35);
      display: block;
      object-fit: cover;
    }

    .game-title, .gameover-title {
      font-family: 'Fredoka One', cursive;
      font-size: 30px;
      color: #ff3b77;
      margin-bottom: 4px;
    }

    .credit-badge {
      display: inline-block;
      font-family: 'Fredoka One', cursive;
      background: linear-gradient(135deg, #ff7096, #ff4071);
      color: #fff;
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: #ff5c8a;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border: 3px solid #ffccd9;
      border-radius: 18px;
      font-size: 16px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      color: #b31d4e;
      background: #fff8fa;
      outline: none;
    }

    .play-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #ff4d79, #e6004c);
      color: white;
      font-family: 'Fredoka One', cursive;
      font-size: 20px;
      border: none;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(230, 0, 76, 0.35);
    }

    .final-score {
      font-size: 15px;
      font-weight: 800;
      color: #777;
      margin-bottom: 18px;
    }

    .final-score span {
      font-family: 'Fredoka One', cursive;
      font-size: 26px;
      color: #c90f4e;
      display: block;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="score-card">
    <div class="cake-icon">🍰</div>
    <div class="text-wrap">
      <div class="label">Sugar Score</div>
      <div class="value" id="score-val">0</div>
    </div>
  </div>

  <div id="leaderboard-card">
    <h3>👑 TOP SWEETS</h3>
    <div id="leaderboard-list"></div>
  </div>

  <div id="joystick-base">
    <div id="joystick-stick">🍓</div>
  </div>

  <div id="rush-btn">
    <div class="rush-top">
      <span>⚡</span>
      <span>🍩</span>
    </div>
    <div class="rush-text">RUSH!</div>
  </div>

  <div id="start-screen">
    <div class="modal-box">
      <img class="app-preview-icon" src="./apple-touch-icon.png" alt="Snake Icon" onerror="this.style.display='none'">
      <h1 class="game-title">Sugar Slither</h1>
      <div class="credit-badge">By Luke Chiu</div>
      <div class="input-group">
        <label for="nickname-input">Sweet Nickname</label>
        <input type="text" id="nickname-input" maxlength="12" value="Berry Mochi" placeholder="Enter name...">
      </div>
      <button class="play-btn" id="start-btn">PLAY NOW ✨</button>
    </div>
  </div>

  <div id="gameover-screen">
    <div class="gameover-box">
      <div style="font-size: 44px; margin-bottom: 6px;">💥🍰</div>
      <h2 class="gameover-title">Crumbly Defeat!</h2>
      <p class="final-score">Final Sugar Score<span id="final-score-val">0</span></p>
      <button class="play-btn" id="restart-btn">TRY AGAIN 🍓</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreValEl = document.getElementById('score-val');
    const leaderboardListEl = document.getElementById('leaderboard-list');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const nicknameInput = document.getElementById('nickname-input');
    const gameoverScreen = document.getElementById('gameover-screen');
    const restartBtn = document.getElementById('restart-btn');
    const finalScoreVal = document.getElementById('final-score-val');
    const joystickBase = document.getElementById('joystick-base');
    const joystickStick = document.getElementById('joystick-stick');
    const rushBtn = document.getElementById('rush-btn');

    const ARENA_RADIUS = 1800;
    const FOOD_COUNT = 320;

    let screenW = window.innerWidth;
    let screenH = window.innerHeight;

    function resizeCanvas() {
      screenW = window.innerWidth;
      screenH = window.innerHeight;
      canvas.width = screenW;
      canvas.height = screenH;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type = 'sine', duration = 0.12, gainLvl = 0.15) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainLvl, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundEat() { playTone(600 + Math.random() * 250, 'triangle', 0.08, 0.12); }
    function soundDefeatEnemy() {
      if (!audioCtx) return;
      [400, 600, 850, 1100].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.15, 0.18), i * 55));
    }
    function soundGameOver() {
      if (!audioCtx) return;
      [440, 370, 310, 240].forEach((f, i) => setTimeout(() => playTone(f, 'sawtooth', 0.2, 0.2), i * 75));
    }

    const DESSERT_TYPES = [
      { emoji: '🍓', glow: 'rgba(255, 105, 140, 0.4)', stroke: '#ff4d79', points: 15, radius: 19 },
      { emoji: '🍩', glow: 'rgba(210, 140, 90, 0.4)',  stroke: '#cd853f', points: 20, radius: 20 },
      { emoji: '🍰', glow: 'rgba(255, 180, 200, 0.4)', stroke: '#ff6699', points: 30, radius: 21 },
      { emoji: '🧁', glow: 'rgba(200, 160, 255, 0.4)', stroke: '#b366ff', points: 25, radius: 20 },
      { emoji: '🧋', glow: 'rgba(230, 175, 130, 0.4)', stroke: '#d29966', points: 35, radius: 22 },
      { emoji: '🍪', glow: 'rgba(218, 165, 32, 0.4)',  stroke: '#d49b38', points: 10, radius: 18 }
    ];

    const DARK_ENEMY_PALETTES = [
      { primary: '#1c1b24', secondary: '#2e2a3b', border: '#453f57', glow: 'rgba(69, 63, 87, 0.4)', eyeGlow: '#a855f7', horn: '🪨' },
      { primary: '#24140e', secondary: '#3d2419', border: '#5c3826', glow: 'rgba(92, 56, 38, 0.4)', eyeGlow: '#fb923c', horn: '☕' },
      { primary: '#2e0a14', secondary: '#4a1222', border: '#731c35', glow: 'rgba(115, 28, 53, 0.45)', eyeGlow: '#f43f5e', horn: '🍒' },
      { primary: '#091e24', secondary: '#11353f', border: '#1f5363', glow: 'rgba(31, 83, 99, 0.45)', eyeGlow: '#38bdf8', horn: '🫐' }
    ];

    const AI_CONFIGS = [
      { name: 'Dark Choco', personality: 'HUNTER', paletteIdx: 1 },
      { name: 'Shadow Plum', personality: 'GLUTTON', paletteIdx: 0 },
      { name: 'Black Cherry', personality: 'AMBUSHER', paletteIdx: 2 },
      { name: 'Abyss Berry', personality: 'TRICKSTER', paletteIdx: 3 }
    ];

    let foods = [];
    function spawnFood(forceX = null, forceY = null, customType = null) {
      let x = forceX, y = forceY;
      if (x === null || y === null) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.sqrt(Math.random()) * (ARENA_RADIUS - 70);
        x = Math.cos(angle) * dist;
        y = Math.sin(angle) * dist;
      }
      const type = customType || DESSERT_TYPES[Math.floor(Math.random() * DESSERT_TYPES.length)];
      return { x, y, type, pulseOffset: Math.random() * Math.PI * 2, size: type.radius };
    }

    function initFoodCluster() {
      foods = [];
      for (let i = 0; i < FOOD_COUNT; i++) foods.push(spawnFood());
    }

    let particles = [];
    function emitSweetBurst(x, y, count = 16, color = '#ff4d79') {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.8 + Math.random() * 5.2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 4 + Math.random() * 5,
          color,
          alpha: 1.0,
          decay: 0.025 + Math.random() * 0.03
        });
      }
    }

    class Snake {
      constructor(x, y, name, isAI = false, aiConfig = null) {
        this.isAI = isAI;
        this.name = name;
        this.aiConfig = aiConfig;
        this.x = x;
        this.y = y;
        this.angle = Math.random() * Math.PI * 2;
        this.targetAngle = this.angle;
        this.baseSpeed = 3.6;
        this.rushSpeed = 6.8;
        this.isBoosting = false;
        this.radius = 24;
        this.score = 300;
        this.dead = false;

        if (!isAI) {
          this.colors = {
            primary: '#ff3d74', secondary: '#ff7fa6', cream: '#ffffff',
            border: '#ffadc3', glow: 'rgba(255, 61, 116, 0.45)',
            eyeGlow: '#fff', topping: '🍓'
          };
        } else {
          const pal = DARK_ENEMY_PALETTES[aiConfig.paletteIdx % DARK_ENEMY_PALETTES.length];
          this.colors = {
            primary: pal.primary, secondary: pal.secondary, cream: '#3a3347',
            border: pal.border, glow: pal.glow,
            eyeGlow: pal.eyeGlow, topping: pal.horn
          };
        }

        this.history = [];
        this.length = 26;
        for (let i = 0; i < this.length * 8; i++) {
          this.history.push({ x: this.x - Math.cos(this.angle) * i, y: this.y - Math.sin(this.angle) * i });
        }
        this.aiTimer = 0;
      }

      getSegmentPositions() {
        const positions = [];
        for (let i = 0; i < this.length; i++) {
          const index = i * 9;
          if (index < this.history.length) positions.push(this.history[index]);
        }
        return positions;
      }

      updateAI(allSnakes) {
        if (!this.isAI || this.dead) return;
        this.aiTimer++;
        const player = allSnakes.find(s => !s.isAI && !s.dead);

        let feelerHit = false;
        let bestTurnDelta = 0;
        const feelerDist = 95;
        const feelerAngles = [0, 0.5, -0.5, 0.9, -0.9, 1.4, -1.4];

        for (let fa of feelerAngles) {
          const checkAngle = this.angle + fa;
          const fx = this.x + Math.cos(checkAngle) * feelerDist;
          const fy = this.y + Math.sin(checkAngle) * feelerDist;
          let collided = Math.hypot(fx, fy) >= ARENA_RADIUS - 40;

          if (!collided) {
            for (let other of allSnakes) {
              if (other === this || other.dead) continue;
              for (let s of other.getSegmentPositions()) {
                if (Math.hypot(fx - s.x, fy - s.y) < this.radius + 16) {
                  collided = true;
                  break;
                }
              }
              if (collided) break;
            }
          }

          if (collided) feelerHit = true;
          else if (feelerHit && bestTurnDelta === 0) bestTurnDelta = fa;
        }

        if (feelerHit) {
          this.targetAngle += (bestTurnDelta !== 0 ? Math.sign(bestTurnDelta) * 0.18 : 0.22);
          this.isBoosting = false;
          return;
        }

        const pType = this.aiConfig.personality;
        if (pType === 'HUNTER' && player) {
          const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
          if (distToPlayer < 750) {
            this.targetAngle = Math.atan2((player.y + Math.sin(player.angle) * 110) - this.y, (player.x + Math.cos(player.angle) * 110) - this.x);
            this.isBoosting = distToPlayer < 380 && this.score > 250;
            return;
          }
        }

        let nearestFood = null;
        let minDist = 650;
        for (let f of foods) {
          const d = Math.hypot(f.x - this.x, f.y - this.y);
          if (d < minDist) { minDist = d; nearestFood = f; }
        }

        if (nearestFood) {
          this.targetAngle = Math.atan2(nearestFood.y - this.y, nearestFood.x - this.x);
          this.isBoosting = pType === 'GLUTTON' && minDist < 200 && Math.random() < 0.15 && this.score > 300;
        } else if (this.aiTimer % 60 === 0) {
          this.targetAngle += (Math.random() - 0.5) * 1.5;
          this.isBoosting = false;
        }
      }

      update() {
        if (this.dead) return;

        let diff = this.targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.angle += diff * (this.isAI ? 0.085 : 0.14);

        const currentSpeed = this.isBoosting ? this.rushSpeed : this.baseSpeed;
        if (this.isBoosting && this.score > 50) {
          this.score -= 0.18;
          if (Math.random() < 0.25) {
            const tail = this.history[this.history.length - 1];
            if (tail) foods.push(spawnFood(tail.x + (Math.random()-0.5)*10, tail.y + (Math.random()-0.5)*10));
          }
        }

        this.x += Math.cos(this.angle) * currentSpeed;
        this.y += Math.sin(this.angle) * currentSpeed;

        this.history.unshift({ x: this.x, y: this.y });
        if (this.history.length > this.length * 10) this.history.pop();

        if (Math.hypot(this.x, this.y) >= ARENA_RADIUS - this.radius) this.die();
      }

      die() {
        if (this.dead) return;
        this.dead = true;
        emitSweetBurst(this.x, this.y, 35, this.colors.primary);

        const segs = this.getSegmentPositions();
        for (let i = 0; i < segs.length; i += 2) {
          foods.push(spawnFood(segs[i].x + (Math.random() - 0.5) * 16, segs[i].y + (Math.random() - 0.5) * 16));
        }

        if (!this.isAI) {
          soundGameOver();
          showGameOver();
        } else {
          soundDefeatEnemy();
        }
      }

      draw(ctx) {
        if (this.dead) return;
        const segs = this.getSegmentPositions();

        for (let i = segs.length - 1; i >= 1; i--) {
          const pt = segs[i];
          const isStripe = (i % 2 === 0);
          const rad = this.radius * (1 - (i / segs.length) * 0.32);

          ctx.beginPath();
          ctx.arc(pt.x, pt.y, rad + 3, 0, Math.PI * 2);
          ctx.fillStyle = this.colors.border;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(pt.x, pt.y, rad, 0, Math.PI * 2);
          ctx.fillStyle = isStripe ? this.colors.primary : this.colors.secondary;
          ctx.fill();
        }

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        ctx.shadowColor = this.colors.glow;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius + 3.5, 0, Math.PI * 2);
        ctx.fillStyle = this.colors.border;
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.colors.primary;
        ctx.fill();

        const eyeOffset = this.radius * 0.45;
        const eyeX = this.radius * 0.35;
        [-eyeOffset, eyeOffset].forEach(eyeY => {
          ctx.beginPath();
          ctx.arc(eyeX, eyeY, 6, 0, Math.PI * 2);
          ctx.fillStyle = this.isAI ? '#111' : '#ffffff';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(eyeX + 1.2, eyeY, 3.8, 0, Math.PI * 2);
          ctx.fillStyle = this.isAI ? this.colors.eyeGlow : '#1a0510';
          ctx.fill();
        });

        ctx.font = `${this.radius}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.colors.topping, -this.radius * 0.35, 0);
        ctx.restore();

        ctx.save();
        ctx.font = "800 12px 'Nunito', sans-serif";
        ctx.textAlign = 'center';
        ctx.fillStyle = this.isAI ? '#3d2f3d' : '#e6005c';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.strokeText(this.name, this.x, this.y - this.radius - 10);
        ctx.fillText(this.name, this.x, this.y - this.radius - 10);
        ctx.restore();
      }
    }

    function getSafeSpawnPosition(existingSnakes, minClearance = 720) {
      for (let attempt = 0; attempt < 80; attempt++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 300 + Math.random() * (ARENA_RADIUS - 600);
        const candidate = { x: Math.cos(angle) * dist, y: Math.sin(angle) * dist };

        let ok = true;
        for (let other of existingSnakes) {
          if (!other || other.dead) continue;
          if (Math.hypot(candidate.x - other.x, candidate.y - other.y) < minClearance) {
            ok = false;
            break;
          }
        }
        if (ok) return candidate;
      }
      return { x: 0, y: 0 };
    }

    let playerSnake = null;
    let enemySnakes = [];
    let camera = { x: 0, y: 0 };
    let gameRunning = false;

    function initGame() {
      const playerName = nicknameInput.value.trim() || 'Berry Mochi';
      foods = [];
      particles = [];
      enemySnakes = [];

      playerSnake = new Snake(0, 0, playerName, false);
      const activeList = [playerSnake];

      AI_CONFIGS.forEach((config) => {
        const safePos = getSafeSpawnPosition(activeList, 720);
        const enemy = new Snake(safePos.x, safePos.y, config.name, true, config);
        enemySnakes.push(enemy);
        activeList.push(enemy);
      });

      initFoodCluster();
      gameRunning = true;
    }

    function respawnEnemy(enemy) {
      setTimeout(() => {
        if (!gameRunning) return;
        const safePos = getSafeSpawnPosition([playerSnake, ...enemySnakes.filter(e => !e.dead)], 750);
        enemy.x = safePos.x;
        enemy.y = safePos.y;
        enemy.dead = false;
        enemy.score = 300;
        enemy.length = 24;
        enemy.history = [];
        for (let i = 0; i < enemy.length * 9; i++) enemy.history.push({ x: enemy.x, y: enemy.y });
      }, 3500);
    }

    function handleCollisions() {
      const allSnakes = [playerSnake, ...enemySnakes].filter(s => s && !s.dead);

      for (let snake of allSnakes) {
        for (let i = foods.length - 1; i >= 0; i--) {
          const f = foods[i];
          if (Math.hypot(snake.x - f.x, snake.y - f.y) < snake.radius + f.size) {
            snake.score += f.type.points;
            snake.length = Math.min(220, 24 + Math.floor(snake.score / 28));
            foods.splice(i, 1);
            foods.push(spawnFood());

            if (snake === playerSnake) {
              soundEat();
              scoreValEl.textContent = Math.floor(playerSnake.score);
            }
          }
        }
      }

      for (let headSnake of allSnakes) {
        for (let bodySnake of allSnakes) {
          if (headSnake === bodySnake) continue;
          for (let s of bodySnake.getSegmentPositions()) {
            if (Math.hypot(headSnake.x - s.x, headSnake.y - s.y) < headSnake.radius + bodySnake.radius * 0.75) {
              headSnake.die();
              if (headSnake.isAI) respawnEnemy(headSnake);
              break;
            }
          }
          if (headSnake.dead) break;
        }
      }
    }

    let joystickActive = false;
    let joystickTouchId = null;
    let joyCenter = { x: 0, y: 0 };
    const maxJoyRadius = 55;

    function handleJoyStart(clientX, clientY, id = null) {
      if (!gameRunning) return;
      joystickActive = true;
      joystickTouchId = id;
      joyCenter = { x: clientX, y: clientY };

      joystickBase.style.left = `${clientX}px`;
      joystickBase.style.top = `${clientY}px`;
      joystickBase.style.display = 'block';
      joystickStick.style.transform = `translate(-50%, -50%)`;
    }

    function handleJoyMove(clientX, clientY) {
      if (!joystickActive || !playerSnake) return;
      const dx = clientX - joyCenter.x;
      const dy = clientY - joyCenter.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 8) playerSnake.targetAngle = Math.atan2(dy, dx);

      const clamped = Math.min(dist, maxJoyRadius);
      const angle = Math.atan2(dy, dx);
      joystickStick.style.transform = `translate(calc(-50% + ${Math.cos(angle) * clamped}px), calc(-50% + ${Math.sin(angle) * clamped}px))`;
    }

    function handleJoyEnd() {
      joystickActive = false;
      joystickTouchId = null;
      joystickBase.style.display = 'none';
      joystickStick.style.transform = `translate(-50%, -50%)`;
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#rush-btn') || e.target.closest('#score-card') || e.target.closest('#leaderboard-card')) return;
      if (!joystickActive) handleJoyStart(e.clientX, e.clientY, e.pointerId);
    });

    window.addEventListener('pointermove', (e) => {
      if (joystickActive && e.pointerId === joystickTouchId) handleJoyMove(e.clientX, e.clientY);
    });

    window.addEventListener('pointerup', (e) => {
      if (joystickActive && e.pointerId === joystickTouchId) handleJoyEnd();
    });

    window.addEventListener('pointercancel', (e) => {
      if (joystickActive && e.pointerId === joystickTouchId) handleJoyEnd();
    });

    rushBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (playerSnake) playerSnake.isBoosting = true;
      rushBtn.classList.add('active');
    });

    const releaseRush = () => {
      if (playerSnake) playerSnake.isBoosting = false;
      rushBtn.classList.remove('active');
    };

    rushBtn.addEventListener('pointerup', releaseRush);
    rushBtn.addEventListener('pointerleave', releaseRush);
    rushBtn.addEventListener('pointercancel', releaseRush);

    function updateLeaderboard() {
      const allSnakes = [playerSnake, ...enemySnakes].filter(s => s !== null);
      allSnakes.sort((a, b) => b.score - a.score);

      leaderboardListEl.innerHTML = '';
      allSnakes.slice(0, 5).forEach((snake, idx) => {
        const row = document.createElement('div');
        row.className = `lb-row ${snake === playerSnake ? 'player' : ''}`;
        row.innerHTML = `
          <span class="lb-rank">#${idx + 1}</span>
          <span class="lb-name">${snake.name}</span>
          <span class="lb-val">${Math.floor(snake.score)}</span>
        `;
        leaderboardListEl.appendChild(row);
      });
    }

    function showGameOver() {
      gameRunning = false;
      handleJoyEnd();
      finalScoreVal.textContent = Math.floor(playerSnake.score);
      gameoverScreen.style.display = 'flex';
    }

    startBtn.addEventListener('click', () => {
      initAudio();
      startScreen.style.display = 'none';
      initGame();
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      gameoverScreen.style.display = 'none';
      initGame();
    });

    function renderBackground() {
      ctx.fillStyle = '#ffe8f0';
      ctx.fillRect(0, 0, screenW, screenH);

      const gridSize = 50;
      const offsetX = -camera.x % gridSize;
      const offsetY = -camera.y % gridSize;

      ctx.beginPath();
      ctx.strokeStyle = '#ffd2e2';
      ctx.lineWidth = 1.2;

      for (let x = offsetX; x < screenW; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, screenH);
      }
      for (let y = offsetY; y < screenH; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(screenW, y);
      }
      ctx.stroke();
    }

    function renderArenaBoundary() {
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, ARENA_RADIUS, 0, Math.PI * 2);
      ctx.shadowColor = 'rgba(255, 30, 80, 0.8)';
      ctx.shadowBlur = 24;
      ctx.lineWidth = 16;
      ctx.strokeStyle = '#ff2b5e';
      ctx.stroke();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      ctx.restore();
    }

    function renderFoods(time) {
      ctx.font = "20px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (let f of foods) {
        if (Math.hypot(f.x - camera.x, f.y - camera.y) > Math.max(screenW, screenH) * 0.85) continue;
        const pulse = Math.sin(time * 0.004 + f.pulseOffset) * 2;
        const rad = f.size + pulse;

        ctx.beginPath();
        ctx.arc(f.x, f.y, rad + 4, 0, Math.PI * 2);
        ctx.fillStyle = f.type.glow;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(f.x, f.y, rad, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.strokeStyle = f.type.stroke;
        ctx.lineWidth = 2.5;
        ctx.fill();
        ctx.stroke();

        ctx.fillText(f.type.emoji, f.x, f.y + 1);
      }
    }

    function renderParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
      }
    }

    let lastLeaderboardUpdate = 0;
    function gameLoop(time) {
      requestAnimationFrame(gameLoop);

      if (gameRunning && playerSnake) {
        enemySnakes.forEach(enemy => {
          enemy.updateAI([playerSnake, ...enemySnakes]);
          enemy.update();
        });

        playerSnake.update();
        handleCollisions();

        camera.x += (playerSnake.x - camera.x) * 0.1;
        camera.y += (playerSnake.y - camera.y) * 0.1;

        if (time - lastLeaderboardUpdate > 250) {
          updateLeaderboard();
          lastLeaderboardUpdate = time;
        }
      }

      ctx.clearRect(0, 0, screenW, screenH);
      renderBackground();

      ctx.save();
      ctx.translate(screenW / 2 - camera.x, screenH / 2 - camera.y);
      renderArenaBoundary();
      renderFoods(time);

      enemySnakes.forEach(enemy => enemy.draw(ctx));
      if (playerSnake) playerSnake.draw(ctx);
      renderParticles();
      ctx.restore();
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
